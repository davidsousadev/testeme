<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Entrar - TesteMe</title>
    <link rel="stylesheet" href="/src/styles/login.css">
</head>

<body>
    <nav>
        <a href="index.html"><img src="/src/images/icones/icon.ico"></a>
    </nav>

    <div class="login-container">
        <h1>Entrar</h1>

        <form id="formLogin">
            <input type="text" id="nick" placeholder="Seu nick" required>
            <div class="input-container">
                <input type="password" id="password" placeholder="Sua senha" required>
                <span class="toggle-password">
                    <img id="eyeIcon" src="/src/images/icones/eye-off.svg" alt="Mostrar senha">
                </span>

            </div>

            <button type="submit">Logar</button>
        </form>
        <a href="cadastrar.html" class="btn_cadastrar">Cadastrar</a>
    </div>

    <script type="module" src="/src/scripts/login.js" defer></script>


</body>

</html>
